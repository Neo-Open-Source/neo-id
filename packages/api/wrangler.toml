name = "neo-id-api"
main = "src/app.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "id.neome.uk/api/*"
zone_name = "neome.uk"

[[routes]]
pattern = "id.neome.uk/.well-known/*"
zone_name = "neome.uk"

[vars]
ENV = "prod"
CDN_BASE = "https://cdn.neome.uk"
# Per-env values (OAuth clients, URLs, mail sender) come from .env.prod
# via scripts/deploy-api.sh --var flags and are never committed.

[triggers]
crons = ["0 * * * *"]

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "neome-storage"

# Shared bucket with neome (custom domain cdn.neome.uk attached in dashboard).
# Keys are content-addressed (avatars/<sha256>.<ext>), same bytes = same key,
# so cross-project dedup is safe. Stock avatars live under avatars/stock/.

# secrets (set via `wrangler secret put`): DATABASE_URL, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, JWT_ISSUER, GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_SECRET, RESEND_API_KEY, TURNSTILE_SECRET_KEY

[observability.logs]
enabled = true
head_sampling_rate = 0
invocation_logs = false

[observability.traces]
enabled = false
