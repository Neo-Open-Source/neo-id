[package]
name = "auth-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
auth-proto = { version = "0.1.0", path = "../auth-proto" }
base64 = "0.22"
base64urlsafedata = { version = "0.5", optional = true }
bcrypt = "0.19"
hex = "0.4"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
opaque-ke = { version = "4", features = ["argon2"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = { version = "0.8", default-features = false }
hmac = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_cbor_2 = { version = "0.13", optional = true }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
thiserror = "2"
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }
voprf = { version = "0.5", default-features = false }
webauthn-rs = { version = "0.5", features = ["danger-credential-internals", "danger-allow-state-serialisation"], optional = true }
webauthn-rs-core = { version = "0.5", optional = true }
zeroize = "1"

[dev-dependencies]
proptest = "1"
rand_chacha = "0.3"
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }

[lints]
workspace = true

[features]
default = ["webauthn"]
webauthn = [
    "dep:webauthn-rs",
    "dep:webauthn-rs-core",
    "dep:serde_cbor_2",
    "dep:base64urlsafedata",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
