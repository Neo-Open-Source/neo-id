[graph]
targets = [
  { triple = "wasm32-unknown-unknown" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa reaches us only via jsonwebtoken for RS256 sign/verify; no decryption path exists so the Marvin padding oracle is unreachable. Re-evaluate if decrypt APIs are ever used or rsa ships a fix." },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "Zlib",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
