syntax = "proto3";

package auth.v1;

// Registered OAuth2/OIDC relying party.
message OAuthClient {
  string client_id = 1;
  // Secret hash; empty for public (PKCE-only) clients.
  string secret_hash = 2;
  repeated string redirect_uris = 3;
  repeated string grant_types = 4;
  repeated string scopes = 5;
  bool require_pkce = 6;
  bool confidential = 7;
}

// Dynamic client registration request (RFC 7591 subset we accept).
message ClientRegistrationRequest {
  string owner_id = 1;
  repeated string redirect_uris = 2;
  optional string client_name = 3;
}

// Dynamic client registration response returned to the caller.
message ClientRegistrationResponse {
  string client_id = 1;
  string client_secret = 2;
  repeated string redirect_uris = 3;
  int64 client_id_issued_at = 4;
  int64 client_secret_expires_at = 5;
  string token_endpoint_auth_method = 6;
}
