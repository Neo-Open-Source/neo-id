syntax = "proto3";

package auth.v1;

// ID token claims as minted by this OP (mirrors the previous service).
message IDTokenClaims {
  string sub = 1;
  string email = 2;
  string name = 3;
  optional string aud = 4;
  string iss = 5;
  int64 iat_unix = 6;
  int64 exp_unix = 7;
  string jti = 8;
  optional string nonce = 9;
  optional string at_hash = 10;
  optional int64 auth_time_unix = 11;
}

// Access token claims. Signed by this OP, verified statelessly by resources.
message AccessClaims {
  string sub = 1;
  string email = 2;
  string role = 3;
  optional string session_id = 4;
  string iss = 5;
  int64 iat_unix = 6;
  int64 exp_unix = 7;
  string jti = 8;
}
