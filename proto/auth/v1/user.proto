syntax = "proto3";

package auth.v1;

// Canonical user record. Source of truth for Rust + SvelteKit codegen.
message User {
  string id = 1;
  string email = 2;
  bool email_verified = 3;
  UserRole role = 4;
  int64 created_at_unix = 5;
  // OPAQUE envelope bytes (server-side only, never sent to web clients).
  bytes opaque_envelope = 6;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_USER = 1;
  USER_ROLE_ADMIN = 2;
}

// OPAQUE envelope record. The envelope is opaque bytes: the server stores
// the blob and hands it back at login without inspecting the inside.
message OpaqueRecord {
  string user_id = 1;
  bytes envelope = 2;
}

// OpenID Connect UserInfo response. Claims are present only when the
// access token's granted scope allows them.
message UserInfo {
  string sub = 1;
  optional string email = 2;
  optional bool email_verified = 3;
  optional string name = 4;
  optional string given_name = 5;
  optional string family_name = 6;
  optional string picture = 7;
}
