<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      type="image/webp"
      href="%sveltekit.assets%/favicon.webp"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/webp"
      href="%sveltekit.assets%/favicon-dark.webp"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="%sveltekit.assets%/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="%sveltekit.assets%/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%sveltekit.assets%/fonts/golos-latin.woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%sveltekit.assets%/fonts/golos-cyrillic.woff2"
      crossorigin="anonymous"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <div
      id="neo-legacy"
      style="display: none; max-width: 24rem; margin: 8vh auto 0; padding: 0 1rem; font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; color: var(--content, #111)"
    >
      <h1 style="font-size: 1.5rem">NeoID</h1>
      <p style="color: var(--muted, #444)">Your browser is too old for the full sign-in page.</p>
      <p><a href="/lite">Continue on the lite page</a></p>
    </div>
    <script>
      (function () {
        var authed = false;
        try {
          authed = 'fetch' in window && 'Promise' in window && 'noModule' in document.createElement('script');
        } catch (e) {
          authed = false;
        }
        var onLite = location.pathname.indexOf('/lite') === 0;
        if (!authed && !onLite) {
          var el = document.getElementById('neo-legacy');
          if (el) el.style.display = 'block';
        }
      })();
    </script>
    <noscript>
      <div
        style="max-width: 24rem; margin: 8vh auto 0; padding: 0 1rem; font-family: Arial, Arial, sans-serif; color: var(--content, #111)"
      >
        <h1 style="font-size: 1.5rem">NeoID</h1>
        <p style="color: var(--muted, #444)">JavaScript is disabled in your browser.</p>
        <p><a href="/lite">Continue on the lite page</a></p>
      </div>
    </noscript>
  </body>
</html>
