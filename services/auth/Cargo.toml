[package]
name = "auth-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
auth-accounts = { version = "0.1.0", path = "crates/auth-accounts", default-features = false }
auth-core = { version = "0.1.0", path = "../../crates/auth-core", default-features = false }
auth-db = { version = "0.1.0", path = "../../crates/auth-db" }
db = { version = "0.1.0", path = "../../crates/db" }
auth-oidc = { version = "0.1.0", path = "crates/auth-oidc" }
auth-proto = { version = "0.1.0", path = "../../crates/auth-proto" }
base64 = "0.22"
captcha-rs = "0.5"
getrandom = "0.3"
rand_chacha = "0.3"
rand_core = "0.6"
serde = "1"
serde_json = "1"
url = "2"
worker = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

[features]
default = ["passkeys"]
passkeys = ["auth-accounts/passkeys", "auth-core/webauthn"]
