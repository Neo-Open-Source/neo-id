name = "neo-auth-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[build]
command = "cargo install -q worker-build && PATH=\"${CARGO_HOME:-$HOME/.cargo}/bin:$PATH\" worker-build --release"

[[kv_namespaces]]
binding = "STATES"
id = "00000000000000000000000000000000"

[vars]
JWT_ISSUER = "https://id.neome.uk"
