[package]
name = "auth-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
base64urlsafedata = "0.5"
bcrypt = "0.19"
hex = "0.4"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
opaque-ke = { version = "4", features = ["argon2"] }
rand = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_cbor_2 = "0.13"
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
thiserror = "2"
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }
uuid = { version = "1", features = ["v4"] }
voprf = { version = "0.5", default-features = false }
webauthn-rs = { version = "0.5", features = ["danger-credential-internals"] }
webauthn-rs-core = "0.5"
zeroize = "1"

[dev-dependencies]
proptest = "1"
rand_chacha = "0.3"
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }

[lints]
workspace = true
